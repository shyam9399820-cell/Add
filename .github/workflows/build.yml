name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: android-actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK & Build Tools
      uses: android-actions/setup-android@v3

    - name: Compile App via Gradle
      run: |
        # Install gradle directly on runner to bypass missing wrapper issues
        sudo apt-get update
        sudo apt-get install -y gradle
        
        # Create local properties required by android build
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Run build command directly
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
