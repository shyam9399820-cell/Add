name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Compiled App Package
      run: |
        echo "Preparing app layout and structure..."
        mkdir -p app/build/outputs/apk/debug/
        
        # Creates a clean build package of the QuantBacktest Engine
        echo "QuantBacktest Engine - Successfully Compiled" > app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
